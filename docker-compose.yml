services:
  tamjid:
    image: ghcr.io/barengs/smp-apps-fe:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tamjid
    restart: unless-stopped
    networks:
      - tamjid-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  tamjid-net:
    external: true
